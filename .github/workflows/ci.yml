name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: Testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, curl
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Unit
        run: ./vendor/bin/pest --testsuite=Unit

      # SQLite em memória: roda em Linux (filesystem case-sensitive, como produção)
      - name: Integration
        run: ./vendor/bin/pest --testsuite=Integration

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, curl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: composer analyse
